# Puerto del servidor (por defecto es 8080, tal como piden las consignas)
server.port=8080

# Configuración de la conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bazar?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Gonzalo3430
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
# 'update' creará las tablas automáticamente si no existen, o las actualizará si cambias las entidades
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola (muy útil para debuguear y ver qué hace Spring Data)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect